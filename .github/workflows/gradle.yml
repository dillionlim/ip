name: Java CI

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Set up repository
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          java-package: jdk+fx

      - name: Build and check with Gradle
        run: ./gradlew check

      - name: Run the console transcript suite
        run: python3 test/run-ui-tests.py

      - name: Check the packaged jar runs on its own
        shell: bash
        run: |
          ./gradlew shadowJar
          cd "$(mktemp -d)"
          cp "$GITHUB_WORKSPACE/build/libs/tally.jar" .
          printf 'todo packaged\nlist\nbye\n' | java -cp tally.jar tally.Tally | grep -q 'packaged'
          test -f data/tally.txt
