plugins {
    id 'checkstyle'
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.5.1'
}

checkstyle {
    toolVersion = '11.0.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

// JavaFX ships native binaries, so the artifact differs per platform. Working the
// classifier out here rather than hardcoding one keeps the build working on any
// machine, which matters because the jar is meant to be handed to other people.
String osName = System.getProperty('os.name').toLowerCase()
String osArch = System.getProperty('os.arch').toLowerCase()
String javaFxClassifier
if (osName.contains('win')) {
    javaFxClassifier = 'win'
} else if (osName.contains('mac')) {
    javaFxClassifier = osArch.contains('aarch64') ? 'mac-aarch64' : 'mac'
} else {
    javaFxClassifier = osArch.contains('aarch64') ? 'linux-aarch64' : 'linux'
}

dependencies {
    String jUnitVersion = '5.14.4'
    String javaFxVersion = '25.0.4'

    implementation "org.openjfx:javafx-base:${javaFxVersion}:${javaFxClassifier}"
    implementation "org.openjfx:javafx-controls:${javaFxVersion}:${javaFxClassifier}"
    implementation "org.openjfx:javafx-fxml:${javaFxVersion}:${javaFxClassifier}"
    implementation "org.openjfx:javafx-graphics:${javaFxVersion}:${javaFxClassifier}"

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

test {
    useJUnitPlatform()

    testLogging {
        events 'passed', 'skipped', 'failed'

        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
        showStandardStreams = false
    }
}

application {
    mainClass = 'tally.Launcher'
}

jar {
    // A lean JAR file (i.e., without the dependencies packaged inside) is not needed.
    enabled = false
    // Rename its output anyway; Gradle forbids it clashing with the shadowJar output file, even for a disabled task.
    archiveClassifier = 'without-dependencies'
}

shadowJar {
    archiveFileName = 'tally.jar'
}

run {
    standardInput = System.in
}

// Lets test/run-ui-tests.py launch the app the same way Gradle would, without
// having to know where the classes and any dependencies live. The classpath is
// captured while the build is configured, so the task works under the
// configuration cache.
tasks.register('printRuntimeClasspath') {
    FileCollection classpath = sourceSets.main.runtimeClasspath
    inputs.files(classpath)
    doLast {
        println classpath.asPath
    }
}
